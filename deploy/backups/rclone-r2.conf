# rclone config for Cloudflare R2  (off-site DB backups)
#
# Install rclone, then add this stanza to ~/.config/rclone/rclone.conf
# (macOS/Linux):   rclone config  → or paste manually and edit the <...>.
#
# Get the values from the Cloudflare dashboard:
#   R2 → Overview → "Manage R2 API Tokens" → Create API token
#     - Permission: Object Read & Write
#     - Scope: the bucket below
#   The Account ID shows on the R2 Overview page.
#
# Then:  rclone lsd r2diplomasi:          # should list your bucket
#
# In ~/.diplomasi-backup.env set:
#   R2_REMOTE=r2diplomasi
#   R2_BUCKET=diplomasi-backups

[r2diplomasi]
type = s3
provider = Cloudflare
access_key_id = <R2_ACCESS_KEY_ID>
secret_access_key = <R2_SECRET_ACCESS_KEY>
endpoint = https://<ACCOUNT_ID>.r2.cloudflarestorage.com
acl = private
